# Diagnostika: vypíše do logu data jedné osoby z posledního hotového webu
# (artefakt „site“ z nočního běhu). Nic nestahuje z psp.cz a nic nenasazuje.
name: Diagnostika dat osoby

on:
  workflow_dispatch:
    inputs:
      obdobi:
        description: "Číslo volebního období"
        default: "10"
      osoba:
        description: "id_osoba (např. 6524 = Vít Rakušan), prázdné = přeskočit"
        default: ""
      turny:
        description: "Stránky stenoprotokolu k rozboru přiřazení bodů, např. 34-518 34-164"
        default: ""
      rok:
        description: "Rok období pro stenoprotokoly (2025 = 10. období)"
        default: "2025"
      organ:
        description: "id_organ období (174 = 10. období)"
        default: "174"

permissions:
  contents: read
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Obnovení cache stažených dat
        if: inputs.turny != ''
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: psp-cache-diag-${{ github.run_id }}
          restore-keys: psp-cache-
      - name: Rozbor přiřazení bodů
        if: inputs.turny != ''
        env:
          PSP_CACHE_DIR: ${{ github.workspace }}/cache
        run: PYTHONPATH=. python scripts/diag_turns.py ${{ inputs.rok }} ${{ inputs.organ }} ${{ inputs.turny }}
      - name: Stažení posledního hotového webu
        if: inputs.osoba != ''
        run: |
          for id in $(gh run list --workflow nightly.yml --status success --limit 10 \
                        --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -n site -D dist 2>/dev/null; then echo "Web z běhu $id"; exit 0; fi
            rm -rf dist
          done
          echo "::error::Nenalezen artefakt site"; exit 1
      - name: Výpis dat osoby
        if: inputs.osoba != ''
        run: |
          d="dist/data/${{ inputs.obdobi }}"
          for f in "o/${{ inputs.osoba }}.json" "sum/${{ inputs.osoba }}.json"; do
            echo "===== $f"; cat "$d/$f" 2>/dev/null || echo "(chybí)"; echo
          done
          f="s/${{ inputs.osoba }}.json.gz"
          echo "===== $f"; (gzip -dc "$d/$f" 2>/dev/null || cat "$d/$f" 2>/dev/null || echo "(chybí)"); echo
          echo "===== KONEC"
