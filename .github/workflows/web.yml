# Aktualizace vzhledu: nasadí změny ve web/ bez stahování dat a bez shrnutí.
# Vezme hotový web (artefakt „site“) z posledního úspěšného nočního běhu,
# přepíše v něm soubory z web/ a nasadí ho na GitHub Pages.
name: Aktualizace vzhledu

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

# Sdílí skupinu s nočním během, aby se nasazení nepřekrývala.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # stažení artefaktu z nočního běhu
  pages: write
  id-token: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stažení posledního hotového webu z nočního běhu
        run: |
          for id in $(gh run list --workflow nightly.yml --status success --limit 10 \
                        --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" -n site -D dist 2>/dev/null; then
              echo "Použit web z nočního běhu $id"
              exit 0
            fi
            rm -rf dist
          done
          echo "::error::Nenalezen artefakt „site“ z nočního běhu. Spusť nejdřív noční workflow (stačí ručně)."
          exit 1

      - name: Přepsání souborů vzhledu
        run: PSP_DIST_DIR=dist python -m pipeline site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
